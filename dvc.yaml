stages:
  prepare:
    cmd: python -m src.transfer_data
    deps:
      - data/raw/imdb
      - src/transfer_data.py
      - src/utils.py
    params:
      - data
    outs:
      - data/processed/imdb
      - reports/data_summary.json
  train:
    cmd: python -m src.transfer_model
    deps:
      - data/processed/imdb/train.csv
      - data/processed/imdb/validation.csv
      - src/transfer_model.py
      - src/utils.py
      - requirements-ml.txt
    params:
      - train
      - tracking
      - data
    outs:
      - models/transformer
    metrics:
      - reports/train_metrics.json:
          cache: false
  evaluate:
    cmd: python -m src.transfer_evaluate
    deps:
      - models/transformer
      - data/processed/imdb/test.csv
      - src/transfer_evaluate.py
      - src/transfer_model.py
      - src/utils.py
    outs:
      - reports/errors.csv
      - reports/confusion_matrix.png
    metrics:
      - reports/test_metrics.json:
          cache: false
