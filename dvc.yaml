stages:
  prepare:
    cmd: python -m src.data_loader
    deps:
      - src/data_loader.py
      - data/raw/reviews.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.model
    deps:
      - src/model.py
      - src/data_loader.py
      - data/processed/train.csv
    outs:
      - data/models/trained/sentiment_model.joblib

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/inference.py
      - data/models/trained/sentiment_model.joblib
      - data/processed/test.csv
    metrics:
      - eval_metrics.json:
          cache: false
